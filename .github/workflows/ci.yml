name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cobertura mínima de linhas, somando testes unitários e de integração (ver scripts/coverage.sh)
  COVERAGE_THRESHOLD: "80"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Instalar ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.*

      - name: Testes (unitários + integração) e cobertura
        run: bash scripts/coverage.sh

      - name: Testes BDD (cenários em Gherkin)
        run: dotnet test tests/OficinaCadastros.BDD --no-build -c Release

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem (sem push)
        run: docker build -t oficina-cadastros-service:ci .

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init (sem backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
