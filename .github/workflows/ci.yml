name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cobertura mínima de linhas em Domain + Application (ver coverlet.runsettings)
  COVERAGE_THRESHOLD: "80"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Testes com cobertura
        run: >
          dotnet test tests/OficinaCadastros.UnitTests --no-build -c Release
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Verificar cobertura mínima
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          arquivos = glob.glob("coverage/**/coverage.cobertura.xml", recursive=True)
          if not arquivos:
              sys.exit("Relatório de cobertura não encontrado.")

          cobertas = validas = 0
          for arq in arquivos:
              raiz = ET.parse(arq).getroot()
              cobertas += int(raiz.get("lines-covered", "0"))
              validas += int(raiz.get("lines-valid", "0"))

          if validas == 0:
              sys.exit("Nenhuma linha instrumentada: confira o Include do coverlet.runsettings.")

          taxa = 100.0 * cobertas / validas
          minimo = float(os.environ["COVERAGE_THRESHOLD"])
          linha = f"Cobertura de linhas (Domain + Application): {taxa:.1f}% ({cobertas}/{validas}) — mínimo {minimo:.0f}%"
          print(linha)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as resumo:
              resumo.write("### Cobertura\n" + linha + "\n")

          if taxa < minimo:
              sys.exit(f"Cobertura {taxa:.1f}% abaixo do mínimo de {minimo:.0f}%.")
          PY

      - name: Testes de integração (Postgres em container)
        run: dotnet test tests/OficinaCadastros.IntegrationTests --no-build -c Release

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem (sem push)
        run: docker build -t oficina-cadastros-service:ci .

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init (sem backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
