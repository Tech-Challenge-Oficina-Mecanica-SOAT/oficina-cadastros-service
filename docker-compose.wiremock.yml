# Mock do Cadastros Service para os outros times (OS, Billing, Execucao).
# Uso: docker compose -f docker-compose.wiremock.yml up
# Base URL: http://localhost:8089
services:
  cadastros-mock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--verbose"]
