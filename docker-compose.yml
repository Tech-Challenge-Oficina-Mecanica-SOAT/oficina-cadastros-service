services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: oficina_cadastros
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: oficina123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_cadastros"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=oficina_cadastros;Username=postgres;Password=oficina123"
      Database__MigrateOnStartup: "true"
    ports:
      - "5001:8080"

volumes:
  pgdata:
